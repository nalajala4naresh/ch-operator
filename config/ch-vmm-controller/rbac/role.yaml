  - vmpools/status
  - vmrollbacks/status
  - vmsets/status
  - vmsnapshots/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - cloudhypervisor.quill.today
  resources:
  - virtualmachinemigrations
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - k8s.cni.cncf.io
  resources:
  - network-attachment-definitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshotcontents
  - volumesnapshots
