apiVersion: apps/v1
kind: Deployment
metadata:
  name: ch-vmm-gateway
  namespace: ch-vmm-system
  labels:
    app.kubernetes.io/name: ch-vmm-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ch-vmm-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ch-vmm-gateway
    spec:
      serviceAccountName: ch-vmm-gateway
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: ch-vmm-gateway
      containers:
        - name: ch-vmm-gateway
          image: ch-vmm-gateway
          args:
            - --secure-port=8443
            - --cert-dir=/var/lib/ch-vmm-gateway/serving-cert
            - --tls-cert-file=/var/lib/ch-vmm-gateway/serving-cert/tls.crt
            - --tls-private-key-file=/var/lib/ch-vmm-gateway/serving-cert/tls.key
            - --daemon-client-cert-dir=/var/lib/ch-vmm-gateway/client-cert
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: serving-cert
              mountPath: /var/lib/ch-vmm-gateway/serving-cert
              readOnly: true
            - name: client-cert
              mountPath: /var/lib/ch-vmm-gateway/client-cert
              readOnly: true
      volumes:
        - name: serving-cert
          secret:
            secretName: ch-vmm-gateway-serving-cert
        - name: client-cert
          secret:
            secretName: ch-vmm-gateway-client-cert
